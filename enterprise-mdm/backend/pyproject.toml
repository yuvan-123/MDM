[project]
name = "enterprise-mdm-backend"
version = "0.1.0"
description = "EnterpriseMDM backend API (FastAPI, multi-tenant Android Enterprise MDM platform)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    # Required at runtime by app/auth/schemas.py's use of pydantic.EmailStr
    # (LoginRequest, RegisterRequest, etc.) — pydantic only imports this
    # lazily on first use of EmailStr, so its absence was masked in any
    # environment that happened to already have email-validator installed
    # for an unrelated reason (as this project's own local dev environment
    # did) and only surfaced in a genuinely clean `pip install .` (e.g. a
    # fresh Docker image).
    "email-validator>=2.0.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "redis>=5.1.0",
    "celery>=5.4.0",
    "passlib[argon2]>=1.7.4",
    # [crypto] extra pulls in the `cryptography` package, required at
    # runtime for the RS256 algorithm — used both for this app's own JWT
    # access tokens (HS256 by default, but Settings.jwt_algorithm is
    # operator-configurable) and, more critically, by
    # app/platform/android/client.py's real Android Management API OAuth
    # flow (RS256-signed JWT-Bearer assertions, always, regardless of
    # jwt_algorithm). Plain "pyjwt" never raises ImportError at import
    # time — only at the first real jwt.encode(algorithm="RS256", ...)
    # call — so this was masked in any environment that already had
    # `cryptography` installed for an unrelated reason, exactly like the
    # email-validator gap above, and only surfaced when real Android
    # credentials were used against a genuinely clean install.
    "pyjwt[crypto]>=2.9.0",
    "python-multipart>=0.0.12",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "h2>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
    "mypy>=1.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]
ignore = ["B008", "B904", "UP042"]

# Phase 15: CI's actual lint step is `ruff check .` (repo-wide) — every
# prior phase's own verification only ever ran `ruff check app [tests]`,
# so these repo-wide findings (pre-existing, none introduced by Phase 15)
# went uncaught until this phase actually ran the same command CI does.
# See docs/architecture/phase-15.md for the full accounting.
[tool.ruff.lint.per-file-ignores]
# `sys.path.insert(...)` must run before the `app.*` imports that follow
# it — these two standalone CLI entrypoints are the only files in this
# codebase that need to manipulate sys.path at all (see each file's own
# module docstring), so this is scoped narrowly to them rather than
# disabled project-wide.
"scripts/*.py" = ["E402"]
# Alembic's own generated migration-script header imports `op`/`context`
# unsorted relative to stdlib/third-party per isort's rules, and the
# hand-maintained model-import block in env.py is intentionally grouped
# and commented by the phase that added each line, not alphabetized — a
# rewrite would destroy that history for no functional benefit.
"migrations/env.py" = ["I001"]
"migrations/script.py.mako" = ["I001"]
# Six long `sa.Column(...)` lines across three migrations predating this
# phase (documented in docs/security/phase-13-security-review.md §2 as
# "left untouched — not this phase's scope to fix") plus three more in
# 0005 (nine total there) — never modified per this project's "do not
# rewrite historical migrations" rule; a lint config exemption, not a file
# edit, is the correct way to let CI's real lint scope pass without
# touching migration content applications may already depend on.
"migrations/versions/0005_phase5_enrollment_policy.py" = ["E501"]
"migrations/versions/0006_phase6_device_commands.py" = ["E501"]
"migrations/versions/0007_phase7_background_jobs.py" = ["E501"]
"migrations/versions/0008_phase8_command_dispatch_and_provider_links.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# Phase 15: CI's actual typecheck step is `mypy .` (repo-wide) — every
# prior phase's own verification only ever ran `mypy app --strict`, so
# `tests/` (pytest-execution-verified, never held to mypy --strict by any
# phase's own convention — e.g. `_SharedSessionFactory` vs.
# `async_sessionmaker[AsyncSession]` in tests/test_worker.py and every
# test file built on the same pattern since Phase 7) was never actually
# clean under this config, uncaught until this phase ran the same command
# CI does. Excluded here the same way `migrations/` already was, rather
# than either loosening `strict` for the whole project or rewriting
# passing tests to satisfy a type-checking bar they were never written
# to. See docs/architecture/phase-15.md for the full accounting.
exclude = ["migrations/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
